name: Hearthroot simulation checks
on:
  push:
    branches:
      - feature/idle-progression
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test simulation and incremental economy
        run: node tests/survival-sim.cjs
